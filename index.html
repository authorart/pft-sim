<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>PFT Simulator — Spirometry</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <body class="bg-slate-50 text-slate-800 antialiased">
    <header class="app-chrome border-b border-slate-200 bg-white/90 backdrop-blur sticky top-0 z-30">
      <div class="mx-auto max-w-7xl px-4 sm:px-6">
        <div class="flex items-center gap-3 py-3">
          <svg class="h-9 w-9 shrink-0" viewBox="0 0 64 64" aria-hidden="true">

            <path d="M10 44 C14 14, 18 12, 22 20 S 38 40, 54 44" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
            <path d="M10 44 C 20 58, 44 58, 54 44" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" />
          </svg>
          <div class="min-w-0">
            <h1 class="text-lg font-semibold leading-tight text-slate-900">PFT Simulator <span class="font-normal text-slate-400">·</span> <span class="font-medium text-indigo-600">Spirometry</span></h1>
            <p class="truncate text-xs text-slate-500">Learn technique, quality control and interpretation · GLI-2012 · ATS/ERS 2019 · ERS/ATS 2022</p>

          <span class="ml-auto hidden rounded-full bg-amber-100 px-2.5 py-1 text-[11px] font-semibold uppercase tracking-wide text-amber-800 sm:inline">Educational use only</span>

        <nav id="tabs" class="-mb-px flex gap-1 overflow-x-auto" role="tablist" aria-label="Sections"></nav>

    <footer class="app-chrome border-t border-slate-200 bg-white">
      <div class="mx-auto flex max-w-7xl flex-col gap-1 px-4 py-5 text-xs text-slate-500 sm:flex-row sm:items-center sm:justify-between sm:px-6">
        <p>© 2026 Sirot Jantharaksa, MD. All rights reserved.</p>
        <p>For medical education only — simulated data, not for clinical decision-making.</p>

    </footer>
    <script type="module" src="/src/main.js"></script>
